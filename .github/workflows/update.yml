name: Daily Stock Data Update

on:
  schedule:
    - cron: '0 19 * * *' # UTCの19時（日本時間の午前4時）に自動実行
  workflow_dispatch: # 手動で「いますぐ実行」するボタンも有効化

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run data update script
        run: python update_data.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # ★ここを修正：4つのCSVすべてを対象にする
          git add prices.csv names.csv volume.csv fundamentals.csv
          
          # 変更がある場合のみ保存（コミット）する
          git commit -m "🌱 Automated data update" || echo "No changes to commit"
          git push